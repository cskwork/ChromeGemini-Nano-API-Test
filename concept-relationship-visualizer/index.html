<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>개념 관계 시각화 도구 - Concept Relationship Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        .concept-node {
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .concept-node:hover {
            filter: brightness(1.2);
        }
        .concept-link {
            fill: none;
            stroke-opacity: 0.6;
        }
        .loading-spinner {
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-4">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">개념 관계 시각화 도구</h1>
                    <p class="text-sm text-gray-600">AI 기반 학습 도구로 개념 간의 연결고리를 발견하세요</p>
                </div>
                <div id="api-status" class="flex items-center space-x-2">
                    <div id="status-indicator" class="w-3 h-3 rounded-full bg-gray-400"></div>
                    <span id="status-text" class="text-sm text-gray-600">API 상태 확인 중...</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Input Panel -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">학습 자료 입력</h2>
                    
                    <!-- Text Input -->
                    <div class="mb-6">
                        <label for="study-material" class="block text-sm font-medium text-gray-700 mb-2">
                            텍스트 입력
                        </label>
                        <textarea 
                            id="study-material" 
                            placeholder="학습하고자 하는 내용을 입력하세요. 예: 강의 노트, 기사, 책 내용 등..."
                            class="w-full h-40 px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-none text-sm"
                        ></textarea>
                    </div>

                    <!-- Action Buttons -->
                    <div class="space-y-3">
                        <button 
                            id="analyze-btn" 
                            class="w-full bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <span id="analyze-text">개념 분석하기</span>
                            <div id="analyze-spinner" class="hidden loading-spinner inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full ml-2"></div>
                        </button>

                        <button 
                            id="clear-btn" 
                            class="w-full bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-gray-500 transition-colors"
                        >
                            내용 지우기
                        </button>
                    </div>

                    <!-- Analysis Status -->
                    <div id="analysis-status" class="mt-4 hidden">
                        <div class="bg-blue-50 border border-blue-200 rounded-md p-3">
                            <div class="flex items-center">
                                <div class="loading-spinner w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full mr-2"></div>
                                <span class="text-sm text-blue-800">AI가 개념을 분석하고 있습니다...</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls Panel -->
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 mt-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">시각화 제어</h3>
                    
                    <!-- Filter Controls -->
                    <div class="space-y-4">
                        <div>
                            <label for="concept-filter" class="block text-sm font-medium text-gray-700 mb-2">
                                개념 검색
                            </label>
                            <input 
                                type="text" 
                                id="concept-filter" 
                                placeholder="개념 이름으로 검색..."
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm"
                            >
                        </div>

                        <div>
                            <label for="relationship-strength" class="block text-sm font-medium text-gray-700 mb-2">
                                관계 강도 필터
                            </label>
                            <input 
                                type="range" 
                                id="relationship-strength" 
                                min="0" 
                                max="100" 
                                value="0"
                                class="w-full"
                            >
                            <div class="flex justify-between text-xs text-gray-500 mt-1">
                                <span>약함</span>
                                <span>강함</span>
                            </div>
                        </div>

                        <!-- Network Actions -->
                        <div class="pt-4 border-t border-gray-200">
                            <div class="space-y-2">
                                <button 
                                    id="reset-view-btn" 
                                    class="w-full bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-500 transition-colors text-sm"
                                >
                                    뷰 리셋
                                </button>

                                <button 
                                    id="save-network-btn" 
                                    class="w-full bg-purple-600 text-white px-4 py-2 rounded-md hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-purple-500 transition-colors text-sm"
                                >
                                    네트워크 저장
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Visualization Area -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-lg shadow-sm border border-gray-200 h-96 lg:h-full min-h-[600px] relative">
                    <!-- Visualization Header -->
                    <div class="px-6 py-4 border-b border-gray-200">
                        <div class="flex justify-between items-center">
                            <h2 class="text-lg font-semibold text-gray-900">개념 관계 맵</h2>
                            <div id="concept-count" class="text-sm text-gray-600">
                                개념: <span id="concept-number">0</span>개, 
                                연결: <span id="connection-number">0</span>개
                            </div>
                        </div>
                    </div>

                    <!-- Visualization Container -->
                    <div id="visualization-container" class="relative w-full h-full">
                        <!-- SVG will be inserted here by D3.js -->
                        <div id="empty-state" class="absolute inset-0 flex items-center justify-center">
                            <div class="text-center">
                                <div class="w-16 h-16 mx-auto mb-4 bg-gray-100 rounded-full flex items-center justify-center">
                                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                                    </svg>
                                </div>
                                <p class="text-gray-500 text-sm">학습 자료를 입력하고 '개념 분석하기'를 클릭하면</p>
                                <p class="text-gray-500 text-sm">개념 관계 맵이 여기에 표시됩니다</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Error Modal -->
    <div id="error-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="mt-3 text-center">
                <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-red-100">
                    <svg class="h-6 w-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                    </svg>
                </div>
                <h3 class="text-lg leading-6 font-medium text-gray-900 mt-4">오류 발생</h3>
                <div class="mt-2 px-7 py-3">
                    <p id="error-message" class="text-sm text-gray-500"></p>
                </div>
                <div class="items-center px-4 py-3">
                    <button 
                        id="close-error-btn" 
                        class="px-4 py-2 bg-red-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-300"
                    >
                        확인
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Modules -->
    <script src="js/gemini-api.js"></script>
    <script src="js/concept-analyzer.js"></script>
    <script src="js/graph-visualizer.js"></script>
    <script src="js/knowledge-network.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
